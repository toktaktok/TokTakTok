<style>
  :root {
    --paper: #f1ebe7; --ink: #221a14; --muted: #6b5d52; --rule: #ddd2c8; --accent: #007aff;
    --font-d: "Space Grotesk", "IBM Plex Sans KR", sans-serif;
    --font-b: "IBM Plex Sans KR", sans-serif;
    --font-m: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-b);
    line-height: 1.6; padding: clamp(1.25rem, 5vw, 3rem);

  h1 { font-family: var(--font-d); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.02em; margin: 0 0 0.4em; }

  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; max-width: 40rem; }
  a.item {
    display: block; padding: 1.1rem 1.25rem; border: 1px solid var(--rule); text-decoration: none; color: var(--ink);
    transition: border-color 120ms ease-out, transform 120ms ease-out;
  }
  a.item:hover { border-color: var(--accent); transform: translateX(2px); }
  a.item .n { font-family: var(--font-m); font-size: 0.8rem; color: var(--accent); display: block; margin-bottom: 0.3em; }
  a.item .t { font-family: var(--font-d); font-weight: 700; font-size: 1.15rem; display: block; }
  a.item .d { color: var(--muted); font-size: 0.9rem; margin-top: 0.3em; display: block; }
  footer { margin-top: 2.5rem; font-family: var(--font-m); font-size: 0.78rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
