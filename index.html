<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toktaktok — 게임 클라이언트 프로그래머</title>
  <meta name="description" content="게임 클라이언트 프로그래머 포트폴리오 — 프로젝트, 경력, 기술 스택.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="index">

  <!-- 상단바 — 스크롤을 내려도 계속 따라오도록 화면에 고정. 히어로 씬 안에 두면
       .hero__scene의 overflow: clip에 걸려 씬을 벗어나는 순간 잘려서, 씬 밖에 둡니다. -->
  <div class="nav-bar wrap">
    <nav class="nav" aria-label="주 메뉴"></nav>
  </div>

  <!-- 히어로 — 화면을 꽉 채우는 풀스크린 씬. 네비/카드/캐릭터가 전부 이 씬 위에 얹힙니다.
       텍스트는 전부 js/render.js가 data/profile.js에서 채웁니다.

       씬 아트는 아래쪽 언덕 띠 하나뿐입니다. 위쪽 하늘은 씬 배경(--color-paper)이
       그대로 이어받아서 이음새가 없습니다 — 원본 시안의 배경색이 이 토큰과 같은 값.
       둥근 사각형을 두 톤(뒤/앞)으로 겹쳐 언덕을 만들고, 왼쪽 언덕은 같은 사각형을
       matrix(-1 0 0 1 …)로 뒤집은 것입니다. 좌표는 원본 1920x1080 기준을 그대로 씁니다. -->
  <section class="hero" aria-label="소개">
    <div class="hero__scene">
      <svg class="hero__scene-art" viewBox="0 721 1920 359"
           preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g fill="var(--scene-hill-far)">
          <rect width="2058" height="244" rx="23" transform="matrix(-1 0 0 1 2143 892)"/>
          <rect width="759" height="117" rx="23" transform="matrix(-1 0 0 1 822 827)"/>
          <rect width="550" height="106" rx="23" transform="matrix(-1 0 0 1 691 755)"/>
          <rect width="286" height="106" rx="23" transform="matrix(-1 0 0 1 481 721)"/>
          <rect x="-171" y="892" width="2058" height="244" rx="23"/>
          <rect x="1038" y="827" width="797" height="117" rx="23"/>
          <rect x="1562" y="789" width="441" height="106" rx="23"/>
          <rect x="1700" y="755" width="300" height="106" rx="23"/>
        </g>
        <g fill="var(--scene-hill-near)">
          <rect width="2058" height="244" rx="23" transform="matrix(-1 0 0 1 2143 892)"/>
          <rect width="416" height="72" rx="16" transform="matrix(-1 0 0 1 705 755)"/>
          <rect width="645" height="65" rx="23" transform="matrix(-1 0 0 1 840 827)"/>
          <rect width="137" height="34" rx="8" transform="matrix(-1 0 0 1 494 721)"/>
          <rect x="-113" y="892" width="2058" height="244" rx="23"/>
          <rect x="1166" y="827" width="727" height="117" rx="23"/>
          <rect x="1620" y="789" width="441" height="106" rx="23"/>
          <rect x="1758" y="755" width="300" height="106" rx="23"/>
        </g>
      </svg>

      <!-- 소개 블록 — 이름·직함 / 헤드라인 / 소개 / 메타가 하나의 세로 흐름.
           나머지는 js/render.js가 h1 앞뒤로 채웁니다. -->
      <div class="hero__copy wrap">
        <div class="hero__copy-inner" data-hero-copy>
          <h1 class="hero__headline" data-hero-title></h1>
        </div>
      </div>
      <div class="hero__dock" data-dock></div>
    </div>
  </section>

  <main class="wrap">

    <section class="section career" id="career" aria-labelledby="career-title">
      <header class="section__head">
        <h2 class="section__title" id="career-title">경력</h2>
      </header>
      <div data-career></div>
    </section>

    <section class="section projects" id="projects" aria-labelledby="projects-title">
      <header class="section__head">
        <h2 class="section__title" id="projects-title">프로젝트</h2>
        <p class="section__note">selected work — 최신순</p>
      </header>
      <div class="filter" data-filter role="group" aria-label="프로젝트 태그 필터"></div>
      <div class="grid" data-projects></div>
    </section>

    <section class="section skills" id="skills" aria-labelledby="skills-title">
      <header class="section__head">
        <h2 class="section__title" id="skills-title">기술</h2>
      </header>
      <div class="glass-panel">
        <table class="spec">
          <tbody data-skills></tbody>
        </table>
      </div>
    </section>

    <section class="section education" id="education" aria-labelledby="education-title">
      <header class="section__head">
        <h2 class="section__title" id="education-title">학력·활동</h2>
      </header>
      <div data-education></div>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <header class="section__head">
        <h2 class="section__title" id="contact-title">연락</h2>
      </header>
      <div data-contact></div>
    </section>

  </main>

  <footer class="colophon">
    <div class="wrap"></div>
  </footer>

  <noscript>
    <div class="wrap" style="padding-block: var(--space-xl);">
      <p>이 페이지는 data/ 폴더의 콘텐츠를 자바스크립트로 그립니다. 자바스크립트를 켜 주세요.</p>
    </div>
  </noscript>

  <script src="data/profile.js"></script>
  <script src="data/career.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/education.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
