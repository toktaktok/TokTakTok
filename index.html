<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toktaktok — 게임 클라이언트 프로그래머</title>
  <meta name="description" content="게임 클라이언트 프로그래머 포트폴리오 — 프로젝트, 경력, 기술 스택.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=6.1">
  <link rel="stylesheet" href="css/site.css?v=6.1">
</head>
<body data-page="index">

  <!-- 상단바 — 스크롤을 내려도 계속 따라오도록 화면에 고정. 히어로 씬 안에 두면
       .hero__scene의 overflow: clip에 걸려 씬을 벗어나는 순간 잘려서, 씬 밖에 둡니다. -->
  <div class="nav-bar wrap">
    <nav class="nav" aria-label="주 메뉴"></nav>
  </div>

  <!-- 히어로 — 화면을 꽉 채우는 풀스크린 씬. 네비/카드/캐릭터가 전부 이 씬 위에 얹힙니다.
       텍스트는 전부 js/render.js가 data/profile.js에서 채웁니다.

       씬 아트는 아래쪽 들판 띠(겹친 종이 시트 4장)와 하늘의 종이 구름뿐입니다. 위쪽 하늘은
       씬 배경(--color-paper)이 그대로 이어받아서 이음새가 없습니다. paper-cut 레이어 기법
       (시트마다 아래로 떨어지는 부드러운 그림자)만 빌려 왔고, 색은 이 사이트의 초록·종이
       팔레트 그대로입니다. 띠의 좌표는 1920x360, 하늘(구름)은 1920x720 기준입니다. -->
  <section class="hero" aria-label="소개">
    <div class="hero__scene">

      <!-- 씬의 맨 뒤 — 하늘에 걸린 큰 시계. 오른쪽 모서리 밖으로 넘어가고, 아래 끝은 능선
           바로 위에 걸려서 문자판 아래 곡선이 다 보입니다(원경). 하늘의 거품이 그 위에 뜹니다.
           테두리·숫자·눈금 없이 면과 바늘(분·초)만 — 거품과 같은 유리 레시피를 훨씬 옅게
           쓴 것이라 위계상 거품보다 한 단계 뒤로 물러납니다. 언덕 띠보다 앞에 두면 안 되므로
           반드시 .hero__scene-art보다 먼저(= 뒤에) 옵니다.
           바늘은 js/render.js가 한국 시간(UTC+9)에 맞춰 매 초 돌립니다. -->
      <div class="hero__clock" data-clock aria-hidden="true">
        <div class="hero__clock-face"></div>
        <svg class="hero__clock-hands" viewBox="0 0 200 200" aria-hidden="true">
          <!-- 바늘은 나침반 바늘처럼 축에서 가장 넓고 양 끝으로 뾰족해지는 마름모(도핀 핸드).
               위쪽이 긴 쪽 = 가리키는 방향, 축 아래로 짧은 꼬리가 남습니다.
               치수는 시안 값: 분침 46 x 494 (문자판 1026 기준). 뷰박스 200 = 1026px이므로
               1단위 = 5.13px — 46px = 8.96단위(반폭 4.48), 494px = 96.3단위.
               초침은 같은 모양을 더 가늘게(26px) 조금 더 길게 뽑아 분침과 구별합니다. -->
          <polygon class="clock__hand clock__hand--min" points="100,19 104.48,100 100,115.3 95.52,100"/>
          <polygon class="clock__hand clock__hand--sec" points="100,17.2 102.53,100 100,115.6 97.47,100"/>
          <circle class="clock__pin" cx="100" cy="100" r="5"/>
        </svg>
      </div>

      <!-- 하늘의 종이 구름 — 같은 paper-cut 시트가 왼쪽에서 오른쪽으로 아주 천천히 흘러갑니다
           (.cloud-drift, 구름마다 2~3분 주기). 채움은 종이색(--scene-cloud)이라 헤드라인이
           위를 지나가도 대비가 떨어지지 않고, 아래쪽 그림자만 구름을 종이 위에서 띄웁니다.
           들판 시트보다 먼저(= 뒤에) 오므로 능선에 닿는 구름은 시트 뒤로 사라집니다.
           상자는 하늘(띠 위쪽)만 차지하며 좌표계는 1920x720. 각 구름의 --from/--to는
           "왼쪽 화면 밖 → 오른쪽 화면 밖"이라, 움직임을 끈 환경에서는 제자리(path 좌표)에 섭니다. -->
      <svg class="hero__clouds" viewBox="0 0 1920 720"
           preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g class="cloud-drift" style="--from: -560px; --to: 1980px; --dur: 170s; --delay: -40s">
          <path class="cloud" d="M120 330 c0 -30 30 -50 58 -42 c10 -34 62 -40 82 -10 c30 -14 66 6 62 36 c26 4 36 34 12 46 H140 c-24 0 -30 -26 -20 -30 Z"/>
        </g>
        <g class="cloud-drift" style="--from: -1010px; --to: 1420px; --dur: 230s; --delay: -150s">
          <path class="cloud" transform="translate(760 210) scale(1.3)" d="M0 60 c-6 -34 30 -56 58 -40 c14 -36 70 -40 86 -6 c34 -10 62 18 50 46 H0 Z"/>
        </g>
        <g class="cloud-drift" style="--from: -1580px; --to: 700px; --dur: 200s; --delay: -90s">
          <path class="cloud" transform="translate(1340 420) scale(0.8)" d="M0 60 c-6 -34 30 -56 58 -40 c14 -36 70 -40 86 -6 c34 -10 62 18 50 46 H0 Z"/>
        </g>
        <g class="cloud-drift" style="--from: -1900px; --to: 460px; --dur: 260s; --delay: -210s">
          <path class="cloud" transform="translate(1620 560) scale(1.05)" d="M0 60 c-6 -34 30 -56 58 -40 c14 -36 70 -40 86 -6 c34 -10 62 18 50 46 H0 Z"/>
        </g>
      </svg>

      <!-- 들판 — 종이를 겹쳐 오려 붙인 4장의 시트(paper-cut). 뒤로 갈수록 옅고 앞으로 올수록
           진한 초록이며, 각 시트는 아래 시트 위에 부드러운 그림자를 떨어뜨려 종이 두께가
           읽힙니다(css의 .sheet). 산·나무·집·동물 같은 오브젝트는 없고 들판 띠만 겹칩니다.
           좌표계는 띠 하나(1920x360) 기준 — 아래 정렬(xMidYMax slice)이라 화면비가 달라져도
           능선은 같은 두께로 바닥에 붙고 좌우만 잘립니다. 시트 순서 = 마크업 순서(뒤→앞). -->
      <svg class="hero__scene-art" viewBox="0 0 1920 360"
           preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g class="sheet">
          <path class="field field--1" d="M-100 96 C200 60 420 112 640 84 C860 56 1060 112 1280 80 C1500 50 1720 98 2020 68 L2020 360 L-100 360 Z"/>
        </g>
        <g class="sheet">
          <path class="field field--2" d="M-100 178 C180 140 380 194 600 170 C820 146 1000 116 1200 150 C1400 184 1620 216 2020 158 L2020 360 L-100 360 Z"/>
        </g>
        <g class="sheet">
          <path class="field field--3" d="M-100 248 C160 210 360 264 560 250 C780 236 940 200 1140 224 C1340 248 1560 294 2020 240 L2020 360 L-100 360 Z"/>
        </g>
        <g class="sheet sheet--deep">
          <path class="field field--4" d="M-100 314 C200 280 420 318 640 304 C860 290 1040 264 1260 280 C1480 296 1700 324 2020 302 L2020 360 L-100 360 Z"/>
        </g>
      </svg>


      <!-- 하늘의 유리 거품 — 씬 오른쪽 위가 비어 시선이 좌상단(소개 블록) → 우하단(마스코트)
           한 방향으로만 흐르던 걸 끊는 두 번째 축. 원본 시안(assets/images/Aero.png) 하늘의
           비눗방울을 섹션 제목 마커와 같은 유리 구슬 레시피로 옮긴 것이라, 새 장식이 아니라
           씬에 원래 있던 요소입니다. 읽어 줄 내용은 없으므로 aria-hidden. -->
      <div class="hero__sky" aria-hidden="true">
        <span class="hero__bubble hero__bubble--1"></span>
        <span class="hero__bubble hero__bubble--2"></span>
        <span class="hero__bubble hero__bubble--3"></span>
      </div>

      <!-- 소개 블록 — 이름·직함 / 헤드라인 / 소개 / 메타가 하나의 세로 흐름.
           나머지는 js/render.js가 h1 앞뒤로 채웁니다. -->
      <div class="hero__copy wrap">
        <div class="hero__copy-inner" data-hero-copy>
          <h1 class="hero__headline" data-hero-title></h1>
        </div>
      </div>
      <div class="hero__dock" data-dock></div>
    </div>
  </section>

  <main class="wrap">

    <section class="section career" id="career" aria-labelledby="career-title">
      <header class="section__head">
        <h2 class="section__title" id="career-title">경력</h2>
      </header>
      <div data-career></div>
    </section>

    <section class="section projects" id="projects" aria-labelledby="projects-title">
      <header class="section__head">
        <h2 class="section__title" id="projects-title">프로젝트</h2>
        <p class="section__note">개인 · 스터디 프로젝트 — 최신순</p>
      </header>
      <div class="filter" data-filter role="group" aria-label="프로젝트 태그 필터"></div>
      <div class="grid" data-projects></div>
    </section>

    <section class="section skills" id="skills" aria-labelledby="skills-title">
      <header class="section__head">
        <h2 class="section__title" id="skills-title">기술</h2>
      </header>
      <div class="glass-panel">
        <table class="spec">
          <tbody data-skills></tbody>
        </table>
      </div>
    </section>

    <section class="section education" id="education" aria-labelledby="education-title">
      <header class="section__head">
        <h2 class="section__title" id="education-title">학력·활동</h2>
      </header>
      <div data-education></div>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <header class="section__head">
        <h2 class="section__title" id="contact-title">연락</h2>
      </header>
      <div data-contact></div>
    </section>

  </main>

  <footer class="colophon">
    <div class="wrap"></div>
  </footer>

  <noscript>
    <div class="wrap" style="padding-block: var(--space-xl);">
      <p>이 페이지는 data/ 폴더의 콘텐츠를 자바스크립트로 그립니다. 자바스크립트를 켜 주세요.</p>
    </div>
  </noscript>

  <script src="data/profile.js?v=6.1"></script>
  <script src="data/career.js?v=6.1"></script>
  <script src="data/skills.js?v=6.1"></script>
  <script src="data/education.js?v=6.1"></script>
  <script src="data/projects.js?v=6.1"></script>
  <script src="js/render.js?v=6.1"></script>
</body>
</html>
